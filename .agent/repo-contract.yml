version: 1
project_name: StudyPack Exam Prep
project_type: static-web-app
stack:
  frontend: React + TypeScript + Vite
  styling: CSS
  persistence_v1: Browser local storage
  deployment: GitHub Pages

source_of_truth:
  product_contract: docs/PRODUCT-OVERVIEW.md
  data_contract: docs/DATA-CONTRACT.md
  gemini_export_contract: docs/GEMINI-EXPORT-CONTRACT.md
  subject_content: subjects/

workflow:
  default_branch: main
  implementation_branch_pattern: agent/<short-description>
  issue_first: true
  pull_request_required: true
  deployment: GitHub Pages from main

quality_gates:
  - npm run lint --prefix app
  - npm run test --prefix app -- --run
  - npm run build --prefix app

boundaries:
  - Do not commit personal learning profiles, credentials, or private source material.
  - Do not add an AI API in V1; Gemini Notebook receives exported documents and clipboard prompts only.
  - Do not replace browser-local learner progress with a backend without an approved product decision.
