labels:
  - name: "type:feature"
    color: "1d76db"
    description: New learner-facing capability.
  - name: "type:bug"
    color: "d73a4a"
    description: Behavior differs from the intended contract.
  - name: "type:data"
    color: "7057ff"
    description: Public question-bank or content correction.
  - name: "type:docs"
    color: "0075ca"
    description: Product or contributor documentation.
  - name: "type:task"
    color: "bfdadc"
    description: Technical delivery task.
  - name: "area:ui"
    color: "c5def5"
    description: Learner-facing interface.
  - name: "area:learning"
    color: "bfe5bf"
    description: Practice, exam or statistics behavior.
  - name: "area:data"
    color: "e4e669"
    description: Question, exam or schema data.
  - name: "area:gemini"
    color: "f9d0c4"
    description: Gemini learning-document export or clipboard prompts.
  - name: "area:platform"
    color: "d4c5f9"
    description: CI, Pages or repository automation.
  - name: "priority:p0"
    color: "b60205"
    description: Blocks studying or deploy.
  - name: "priority:p1"
    color: "d93f0b"
    description: Important for the next release.
  - name: "priority:p2"
    color: "fbca04"
    description: Valuable but can wait.
  - name: "status:needs-triage"
